services:
  - type: web
    name: bc-vacation-rental-platform
    runtime: static
    staticPublishPath: .
    domains:
      - platform.bcvacationrental.ca
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
